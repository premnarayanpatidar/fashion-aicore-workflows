# AI Core Serving Template — Fashion In-Season Contract Consumption Model
# ServingTemplate wraps a KServe InferenceService (serving.kserve.io/v1beta1)
# spec.template.metadata.labels: JSON-encoded string
# spec.template.spec: JSON-encoded KServe InferenceService predictor spec
apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: fashion-inseason-serve
  annotations:
    executables.ai.sap.com/name: "fashion-inseason-serve"
  labels:
    scenarios.ai.sap.com/id: "fashion-inseason-consumption"
    executables.ai.sap.com/id: "fashion-inseason-serve"
    ai.sap.com/version: "1.0.0"
spec:
  template:
    apiVersion: serving.kserve.io/v1beta1
    metadata:
      labels: '{"ai.sap.com/resourcePlan":"starter"}'
    spec: '{"predictor":{"containers":[{"name":"kserve-container","image":"docker.io/docprem/fashion-inseason-serve:1.0.0","ports":[{"containerPort":9000,"name":"http","protocol":"TCP"}],"env":[{"name":"PORT","value":"9000"}],"resources":{"requests":{"cpu":"1","memory":"2Gi"},"limits":{"cpu":"2","memory":"4Gi"}}}]}}'
